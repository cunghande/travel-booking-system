# ============================================================
# Travel Booking System — Docker Compose
# ============================================================

services:
  # --- FastAPI Application ---
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: travel-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - travel-network

  # --- PostgreSQL 16 + pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-travel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_secret_change_me}
      POSTGRES_DB: ${DB_NAME:-travel_booking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_user} -d ${DB_NAME:-travel_booking}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - travel-network

  # --- Redis 7.2 ---
  redis:
    image: redis:7.2-alpine
    container_name: travel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - travel-network

  # --- Celery Worker (placeholder) ---
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: travel-worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    networks:
      - travel-network

  # --- Celery Beat (placeholder) ---
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: travel-beat
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    networks:
      - travel-network

volumes:
  postgres_data:
  redis_data:

networks:
  travel-network:
    driver: bridge
